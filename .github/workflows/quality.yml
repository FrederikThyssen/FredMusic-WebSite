name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --reporter=dot

      - name: Build
        run: npm run build

      - name: Responsive smoke
        run: npm run test:e2e

      # Code livré aux visiteurs : toute faille modérée ou plus bloque.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=moderate

      # Outils de build/test (jamais exécutés en production) : seules les
      # failles critiques bloquent. Tailwind 3 tire encore braces et
      # postcss-selector-parser sans version corrigée compatible.
      - name: Dependency audit (tooling)
        run: npm audit --audit-level=critical

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
